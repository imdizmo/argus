# Copy to ~/.config/argus/config.toml and chmod 600.
#
# Argus shows two kinds of services in one rail:
#   1) Uptime-Kuma monitors (optional — set the kuma_* keys below)
#   2) Manual links pinged directly every `interval` seconds (the [[services]])
# You need at least one of the two. You can also edit these from the tray
# Settings page.

# --- Uptime-Kuma (optional) ---
kuma_url = "https://uptime-kuma.example.com"
username = "admin"
# Provide ONE of the following:
password = "change-me"
# password_command = "secret-tool lookup argus kuma_password"

# --- Manual links (optional) ---
# Each is HTTP-pinged on its interval; 2xx/3xx = up (green), else down (red).
[[services]]
name = "Gitlab"
url  = "https://gitlab.example.com"

[[services]]
name = "Jellyfin"
url  = "https://jelly.example.com/health"
interval = 30      # seconds; default 60

# --- Appearance ---
edge = "right"          # "right" or "left"
collapsed_style = "dots"  # collapsed look: "dots" (peeking status dots) or "edge" (thin accent strip)
collapsed_px = 24       # width of the peeking status-dot strip when hidden
expanded_px = 260       # rail width when revealed (fits a tile: dot + favicon + name)
icon_px = 24            # favicon size inside a tile
reveal_delay_ms = 0
hide_delay_ms = 250
